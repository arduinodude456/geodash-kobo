name: Build Geometry Rush for Kobo

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake bison flex gawk \
            libtool libtool-bin libncurses-dev curl file git gperf help2man texinfo \
            unzip wget cmake pkg-config python3 zip xz-utils perl ca-certificates

      # Same toolchain cache as the Doom build (restore + save right after building it).
      - name: Restore koxtoolchain cache
        id: tc-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/x-tools
          key: koxtoolchain-kobo-v1

      - name: Build koxtoolchain (kobo)
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: bash scripts/01-toolchain.sh

      - name: Save koxtoolchain cache
        if: steps.tc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/x-tools
          key: koxtoolchain-kobo-v1

      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: cache/src
          key: deps-src-${{ hashFiles('scripts/versions.sh') }}

      - name: Restore built dependencies
        id: deps-built
        uses: actions/cache/restore@v4
        with:
          path: deps
          key: gd-deps-built-${{ hashFiles('scripts/02-deps.sh', 'scripts/env.sh') }}

      - name: Cross-build libraries (zlib, libvncserver)
        if: steps.deps-built.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p build
          bash scripts/02-deps.sh 2>&1 | tee build/02-deps.log

      - name: Save built dependencies
        if: steps.deps-built.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: deps
          key: gd-deps-built-${{ hashFiles('scripts/02-deps.sh', 'scripts/env.sh') }}

      - name: Cross-build raylib 6.0 (software renderer) + GeometryRush + VNC shim
        shell: bash
        run: |
          mkdir -p build
          bash scripts/03-geodash.sh 2>&1 | tee build/03-geodash.log

      - name: Package
        run: bash scripts/04-package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: geodash-kobo
          path: dist/geodash-kobo.zip

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/**/CMakeError.log
            build/**/CMakeOutput.log
            build/*.log

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/geodash-kobo.zip
